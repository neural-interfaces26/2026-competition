version: 2
title: "Neural Interfaces 2026 — Track 3: Sleep Onset"
description: >
  Predict the latency (seconds) to the first stable N2 sleep epoch from short
  EEG windows. Submissions ship a trained model (code + weights); the platform
  runs inference-only on the held-out split and ranks by binned MAE (bMAE).
  Powered by benchopt + neuralbench.
image: logo.jpg
registration_auto_approve: False

terms: pages/terms.md
pages:
  - title: Competition
    file: pages/competition.html
  - title: Participation
    file: pages/participate.md
  - title: Timeline
    file: pages/timeline.md

tasks:
  - index: 0
    name: Sleep onset
    description: >
      The ingestion program runs the bundled benchopt benchmark inference-only
      on your submission; scoring parses the produced results dataframe.
    input_data: dev_phase/input_data/
    reference_data: dev_phase/reference_data/
    ingestion_program: ingestion_program/
    scoring_program: scoring_program/

solutions:
  - index: 0
    tasks:
      - 0
    path: solution/

phases:
  - name: Development Phase
    description: 'Development phase: build and test your model.'
    start: 01-01-2026
    end: 11-16-2026
    tasks:
      - 0

leaderboards:
  - title: Results
    key: main
    columns:
      - title: bMAE (s)
        key: bmae
        index: 0
        sorting: asc
      - title: MAE (s)
        key: mae
        index: 1
        sorting: asc
      - title: Duration (s)
        key: duration
        index: 2
        sorting: asc
