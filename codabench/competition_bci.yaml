version: 2
title: "Neural Interfaces 2026 — Track 2: BCI Decoding"
description: >
  Decode cued mental commands from short EEG windows.
  Submissions ship a trained model (code + weights); the platform runs
  inference-only on the held-out split, one session at a time, and ranks by
  balanced accuracy averaged over cells. Powered by benchopt + neuralbench.
image: logo.jpg
registration_auto_approve: False
contact_email: neurips2026-eeg-emg-competition@googlegroups.com

# The image submissions run in; it must carry the requirements.txt stack.
# Built from tools/Dockerfile with tools/build_image.sh.
docker_image: lionelyneuro/neural-compet:v3

# Only the leaderboard metrics are exposed: no detailed_results.html is
# produced by the scoring program, and the forum is unused (support goes
# through contact_email).
enable_detailed_results: False
show_detailed_results_in_submission_panel: False
show_detailed_results_in_leaderboard: False
forum_enabled: False

terms: pages/terms.md
pages:
  - title: Track description
    file: pages/competition_bci.md
  - title: Scientific FAQ
    file: pages/scientific_faq_bci.md
  - title: Registration Guide
    file: pages/registration.md
  - title: Submission Guide
    file: pages/participate.md
  - title: Timeline
    file: pages/timeline.md

tasks:
  - index: 0
    name: BCI decoding
    description: >
      The ingestion program runs the bundled benchopt benchmark inference-only
      on your submission; scoring parses the produced results dataframe.
    input_data: warmup_phase/input_data/
    reference_data: warmup_phase/reference_data/
    ingestion_program: ingestion_program/
    scoring_program: scoring_program/

solutions:
  - index: 0
    tasks:
      - 0
    path: solution/

# Stored timestamps are UTC; the announced schedule uses Europe/Paris.
# November is CET (UTC+01:00): warm-up closes Nov 1 at 23:59 CET;
# sealed opens Nov 5 at 00:01 and closes Nov 21 at 23:59 CET.
phases:
  - index: 0
    name: Warm-up Phase
    description: 'Warm-up phase: build and test your model against the
      public split. Up to 5 submissions per participant per day for this
      track, with 100 submissions total.'
    start: 2026-09-21 00:00:00
    end: 2026-11-01 22:59:00
    execution_time_limit: 3600
    max_submissions_per_day: 5
    max_submissions: 100
    tasks:
      - 0
  - index: 1
    name: Sealed Final Phase
    description: 'Sealed final phase: at most five submissions per participant
      for this track, one per day. The best eligible score from you or your team
      is automatically displayed and retained for the final ranking;
      the top three teams undergo a reproducibility audit.'
    start: 2026-11-04 23:01:00
    end: 2026-11-21 22:59:00
    execution_time_limit: 3600
    max_submissions_per_day: 1
    max_submissions: 5
    # Sealed: aggregate scores stay visible; execution logs and
    # prediction/scoring-step files are hidden from participants.
    hide_output: True
    hide_prediction_output: True
    hide_score_output: True
    tasks:
      - 0

leaderboards:
  - title: Results
    key: main
    submission_rule: Force_Best
    hidden: False
    columns:
      - title: Balanced accuracy, cell mean
        key: balanced_accuracy_cell_mean
        index: 0
        sorting: desc
      - title: Balanced accuracy, pooled
        key: balanced_accuracy
        index: 1
        sorting: desc
      - title: Accuracy
        key: accuracy
        index: 2
        sorting: desc
      - title: Duration (s)
        key: duration
        index: 3
        sorting: asc
