# Phase config — emg_pose, warm-up phase.
# A native `benchopt run --config` file; the extra `scoring` key is read
# by the scoring program (stripped by ingestion before the run).
dataset:
  # Official corpus: Salter2024Emg2pose (NM000281), via the neuralbench
  # `emg/pose` task. subset=test stages the evaluation split only (the raw
  # download still fetches the full study — see benchmark_utils.nb_task).
  # One dataset only: scoring reads the first result row.
  - Salter2024Emg2pose[subset=test]
seed: 42
no_timeout: true
scoring:
  columns:
    angular_mae: objective_angular_mae
