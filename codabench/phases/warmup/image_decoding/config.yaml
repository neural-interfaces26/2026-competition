# Phase config — image_decoding, warm-up phase.
# A native `benchopt run --config` file; the extra `scoring` key is read
# by the scoring program (stripped by ingestion before the run).
dataset:
  # Gifford2022Large (THINGS-EEG2), the task default; staged in /data by the
  # worker provisioning from this file. subset=test restricts extraction and
  # the DINOv2 embedding pass to the evaluation split. One dataset only:
  # scoring reads the first result row.
  - Image[study=gifford2022large,subset=test]
seed: 42
no_timeout: true
scoring:
  columns:
    top5_acc: objective_top5_acc
    top1_acc: objective_top1_acc
