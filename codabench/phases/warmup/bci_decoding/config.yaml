# Phase config — bci_decoding, warm-up phase.
# A native `benchopt run --config` file; the extra `scoring` key is read
# by the scoring program (stripped by ingestion before the run).
dataset:
  - Simulated
  # Public proxy — uncommenting it makes the worker stage it in /data.
  # subset=test restricts extraction to the evaluation split (the raw
  # download still fetches the full study — see compet_core.nb_task).
  # - BCI[study=dreyer2023,subset=test]
seed: 42
no_timeout: true
scoring:
  columns:
    balanced_accuracy: objective_balanced_accuracy
    accuracy: objective_accuracy
