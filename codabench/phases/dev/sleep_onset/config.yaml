# Phase config — sleep_onset, development phase.
# A native `benchopt run --config` file; the extra `data_home` and `scoring`
# keys are read by the ingestion/scoring programs (benchopt ignores them).
dataset:
  - Simulated
  # Warm-up proxy (Kemp2000Analysis, Sleep-EDF Expanded), staged in /data by
  # the worker provisioning from this very file.
  - Sleep-EDF
# where the compute worker mounts the staged data (read-only)
data_home: /app/data
seed: 42
no_timeout: true
scoring:
  columns:
    bmae: objective_bmae
    mae: objective_mae
