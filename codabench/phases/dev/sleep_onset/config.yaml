# Phase config — sleep_onset, development phase.
# A native `benchopt run --config` file; the extra `data_home` and `scoring`
# keys are read by the ingestion/scoring programs (benchopt ignores them).
dataset:
  - Simulated
  # - Sleep-EDF[batch_size=64]   # public proxy — enable once /data is staged
seed: 42
no_timeout: true
scoring:
  columns:
    bmae: objective_bmae
    mae: objective_mae
