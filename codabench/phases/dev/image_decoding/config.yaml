# Phase config — image_decoding, development phase.
# A native `benchopt run --config` file; the extra `data_home` and `scoring`
# keys are read by the ingestion/scoring programs (benchopt ignores them).
dataset:
  - Simulated
  # - THINGS-EEG2                # public proxy — uncommenting it makes the worker stage it in /data
seed: 42
no_timeout: true
scoring:
  columns:
    top5_acc: objective_top5_acc
    top1_acc: objective_top1_acc
