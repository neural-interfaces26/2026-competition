# Phase config — image_decoding, development phase.
# A native `benchopt run --config` file; the extra `scoring` key is read
# by the scoring program (stripped by ingestion before the run).
dataset:
  - Simulated
  # Warm-up proxy — Alljoined-1.6M, same 32-ch Emotiv hardware as the hidden
  # eval cohort. Uncommenting it makes the worker stage it in /data (needs
  # the neuralbench >= 0.3 stack in the image). subset=test restricts
  # extraction and the DINOv2 embedding pass to the evaluation split.
  # - Image[study=xu2025alljoined,subset=test]
seed: 42
no_timeout: true
scoring:
  columns:
    top5_acc: objective_top5_acc
    top1_acc: objective_top1_acc
