version: 2
title: EEG Models Competition 2026
description: >
  Evaluate EEG foundation models (linear probing) against task-specific
  specialist models, across two regimes: motor-imagery decoding (epoched) and
  sleep staging / onset detection (continuous/dense). Powered by benchopt.
image: logo.png
registration_auto_approve: False

terms: pages/terms.md
pages:
  - title: Participation
    file: pages/participate.md
  - title: Seed
    file: pages/seed.md
  - title: Timeline
    file: pages/timeline.md

tasks:
  - index: 0
    name: Development Task
    description: >
      Train on the training split and get scored on the test split for both
      EEG tasks. The ingestion program runs the bundled benchopt benchmark on
      your submission; scoring parses the produced results dataframe.
    input_data: dev_phase/input_data/
    reference_data: dev_phase/reference_data/
    ingestion_program: ingestion_program/
    scoring_program: scoring_program/

solutions:
  - index: 0
    tasks:
      - 0
    path: solution/

phases:
  - name: Development Phase
    description: 'Development phase: build and test your encoder / model.'
    start: 01-01-2026
    end: 06-30-2026
    tasks:
      - 0

leaderboards:
  - title: Results
    key: main
    columns:
      # --- Foundation-model track (linear probing) ---
      - title: FM · MI bal-acc
        key: linear_probe_mi_balanced_accuracy
        index: 0
        sorting: desc
      - title: FM · Sleep staging bal-acc
        key: linear_probe_sleep_staging_balanced_accuracy
        index: 1
        sorting: desc
      - title: FM · Sleep onset F1
        key: linear_probe_sleep_onset_f1
        index: 2
        sorting: desc
      # --- Specialist track ---
      - title: Spec · MI bal-acc
        key: general_mi_balanced_accuracy
        index: 3
        sorting: desc
      - title: Spec · Sleep staging bal-acc
        key: general_sleep_staging_balanced_accuracy
        index: 4
        sorting: desc
      - title: Spec · Sleep onset F1
        key: general_sleep_onset_f1
        index: 5
        sorting: desc
      - title: Duration (s)
        key: duration
        index: 6
        sorting: asc
