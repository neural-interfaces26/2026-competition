[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "compet_core"
version = "0.1.0"
description = "Shared components for the NeurIPS 2026 neural-interfaces competition benchmarks"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "scikit-learn",
]

[project.optional-dependencies]
# Real-data tracks pull the neuro-AI data stack; Simulated needs none of it.
data = ["neuralset", "neuralfetch", "neuralbench"]

[tool.setuptools]
packages = ["compet_core"]
