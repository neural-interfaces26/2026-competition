# Starter config — train the linear baseline on the public warm-up data and
# write a ready-to-upload submission. Two steps from the repo root:
#   benchopt prepare tracks/sleep_onset --config tracks/sleep_onset/starter.yml
#   benchopt run     tracks/sleep_onset --config tracks/sleep_onset/starter.yml
objective:
  - Sleep-onset[training=True]
dataset:
  - Sleep-EDF
solver:
  - Torch-Linear
seed: 42
