# Test that the docker image builds correctly and that running the ingestion
# and scoring programs works (bundle layout: benchmark/ + compet_core/ at the
# bundle root next to the programs). Runs on the zero-download Simulated
# dataset of one track per family (classification + regression).
name: Test Docker Image

on:
    push:
        branches: [ main ]
    pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
    test-docker:
        runs-on: ubuntu-latest
        env:
            DOCKER_IMAGE_NAME: docker-codabench-test

        steps:
            - name: Delete huge unnecessary tools folder
              run: |
                echo "Disk usage BEFORE cleanup:"; df -h
                rm -rf /usr/share/dotnet || true
                sudo rm -rf /usr/local/lib/android || true
                rm -rf /opt/ghc || true
                sudo rm -rf /usr/local/.ghcup || true
                echo "Disk usage AFTER cleanup:"; df -h

            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Docker build
              uses: docker/build-push-action@v6
              with:
                file: ./tools/Dockerfile
                push: false
                load: true
                tags: ${{ env.DOCKER_IMAGE_NAME }}
                cache-from: type=gha,scope=${{ env.DOCKER_IMAGE_NAME }}-${{ hashFiles('**/Dockerfile') }}-${{ hashFiles('**/requirements.txt') }}
                cache-to: type=gha,mode=max,scope=${{ env.DOCKER_IMAGE_NAME }}-${{ hashFiles('**/Dockerfile') }}-${{ hashFiles('**/requirements.txt') }}

            - name: Test ingestion + scoring programs (per track)
              run: |
                for track in bci_decoding sleep_onset; do
                    echo "=== $track ==="
                    docker run --rm -u root \
                        -v "./codabench/ingestion_program":/app/ingestion_program \
                        -v "./compet_core":/app/compet_core \
                        -v "./tracks/$track":/app/benchmark \
                        -v "./ingestion_res_$track":/app/output \
                        -v "./solution/$track":/app/ingested_program \
                        --name ingestion ${{ env.DOCKER_IMAGE_NAME }} \
                            python /app/ingestion_program/ingestion.py \
                                --datasets Simulated
                    docker run --rm -u root \
                        -v "./codabench/scoring_program":/app/scoring_program \
                        -v "./ingestion_res_$track":/app/input/res \
                        -v "./scoring_res_$track":/app/output \
                        --name scoring ${{ env.DOCKER_IMAGE_NAME }} \
                            python /app/scoring_program/scoring.py
                done
