# Build each track's Docker image (tools/Dockerfile --build-arg TRACK) and
# evaluate it end-to-end: run the baked-in ingestion + scoring programs on
# the zero-download Simulated dataset — a CI-only run config mounted over
# /app/input_data — exactly as the Codabench worker would (only the
# submission and output dirs are mounted). The heavy base + requirements
# layers are shared across the 4 matrix builds via the buildx GHA cache, so
# only the small per-track COPY layers differ.
name: Test Docker Image

on:
    push:
        branches: [ main ]
    pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
    test-docker:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                track:
                    - image_decoding
                    - bci_decoding
                    - sleep_onset
                    - emg_pose
        env:
            DOCKER_IMAGE_NAME: neural-compet-${{ matrix.track }}:ci

        steps:
            - name: Delete huge unnecessary tools folder
              run: |
                echo "Disk usage BEFORE cleanup:"; df -h
                rm -rf /usr/share/dotnet || true
                sudo rm -rf /usr/local/lib/android || true
                rm -rf /opt/ghc || true
                sudo rm -rf /usr/local/.ghcup || true
                echo "Disk usage AFTER cleanup:"; df -h

            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Docker build
              uses: docker/build-push-action@v6
              with:
                context: .
                file: ./tools/Dockerfile
                build-args: TRACK=${{ matrix.track }}
                push: false
                load: true
                tags: ${{ env.DOCKER_IMAGE_NAME }}
                # One shared cache scope for all tracks: the base +
                # requirements layers precede ARG TRACK, so every matrix job
                # reuses them and only rebuilds its COPY layers.
                cache-from: type=gha,scope=docker-${{ hashFiles('tools/Dockerfile') }}-${{ hashFiles('requirements.txt') }}
                cache-to: type=gha,mode=max,scope=docker-${{ hashFiles('tools/Dockerfile') }}-${{ hashFiles('requirements.txt') }}

            - name: Evaluate the sample submission in the image
              run: |
                # CI run config: Simulated only — the real phase configs pull
                # real datasets, which have no place in CI.
                mkdir -p ci_input_data
                printf 'dataset:\n  - Simulated\nseed: 42\nno_timeout: true\n' \
                    > ci_input_data/config.yaml
                docker run --rm -u root \
                    -v "./ci_input_data":/app/input_data \
                    -v "./solution/${{ matrix.track }}":/app/ingested_program \
                    -v "./ingestion_res":/app/output \
                    ${{ env.DOCKER_IMAGE_NAME }} \
                    python3 /compet/ingestion_program/ingestion.py
                docker run --rm -u root \
                    -v "./ingestion_res":/app/input/res \
                    -v "./scoring_res":/app/output \
                    ${{ env.DOCKER_IMAGE_NAME }} \
                    python3 /compet/scoring_program/scoring.py
                echo "leaderboard scores:"; cat scoring_res/scores.json
