# Build the Docker image (tools/Dockerfile) and evaluate it end-to-end per
# track: mount a phase bundle on /app/input_data — the track's benchmark plus
# a zero-download Simulated run config — and run the baked-in ingestion +
# scoring programs, exactly as the Codabench worker would. One image serves
# every track, so the matrix jobs share the whole build through the buildx
# GHA cache.
name: Test Docker Image

on:
    push:
        branches: [ main ]
    pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
    test-docker:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                track:
                    - image_decoding
                    - bci_decoding
                    - sleep_onset
                    - emg_pose
        env:
            DOCKER_IMAGE_NAME: neural-compet:ci

        steps:
            - name: Delete huge unnecessary tools folder
              run: |
                echo "Disk usage BEFORE cleanup:"; df -h
                rm -rf /usr/share/dotnet || true
                sudo rm -rf /usr/local/lib/android || true
                rm -rf /opt/ghc || true
                sudo rm -rf /usr/local/.ghcup || true
                echo "Disk usage AFTER cleanup:"; df -h

            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Docker build
              uses: docker/build-push-action@v6
              with:
                context: .
                file: ./tools/Dockerfile
                push: false
                load: true
                tags: ${{ env.DOCKER_IMAGE_NAME }}
                # One shared cache scope: every matrix job builds the very
                # same image and only the run step differs.
                cache-from: type=gha,scope=docker-${{ hashFiles('tools/Dockerfile') }}-${{ hashFiles('requirements.txt') }}
                cache-to: type=gha,mode=max,scope=docker-${{ hashFiles('tools/Dockerfile') }}-${{ hashFiles('requirements.txt') }}

            - name: Evaluate the sample submission in the image
              run: |
                # A phase bundle, as the platform mounts it: the track's
                # benchmark plus a Simulated-only run config (the real phase
                # configs pull real datasets, which have no place in CI).
                mkdir -p ci_input_data
                cp -rL "tracks/${{ matrix.track }}" ci_input_data/benchmark   # -L: benchmark_utils is a link
                printf 'dataset:\n  - Simulated\nseed: 42\nno_timeout: true\n' \
                    > ci_input_data/config.yaml
                docker run --rm -u root \
                    -v "./ci_input_data":/app/input_data \
                    -v "./solution/${{ matrix.track }}":/app/ingested_program \
                    -v "./ingestion_res":/app/output \
                    ${{ env.DOCKER_IMAGE_NAME }} \
                    python3 /compet/ingestion_program/ingestion.py
                docker run --rm -u root \
                    -v "./ingestion_res":/app/input/res \
                    -v "./scoring_res":/app/output \
                    ${{ env.DOCKER_IMAGE_NAME }} \
                    python3 /compet/scoring_program/scoring.py
                echo "leaderboard scores:"; cat scoring_res/scores.json
