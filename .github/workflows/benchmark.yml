# CI for the 4 track benchmarks (tracks/<name>/).
#
# Uses a self-managed test job rather than benchopt/template_benchmark's
# reusable test workflow: that workflow lets `benchopt test` create a conda
# env and install the objective requirements, and `pip install torch` on the
# Linux runners pulls the CUDA wheel stack (~6 GB), exceeding their disk.
# Here we pre-install a CPU-only torch and run the tests with
# `--skip-install -k simulated` (the zero-download tests) — real-data runs
# happen on the cluster instead. Lint keeps the reusable workflow.
name: Benchmark

on:
  push:
    branches:
      - main
  create:
    tags:
      - '**'
  pull_request:
    branches:
      - main
  schedule:
    # Run every 1st of the month at 7:42am UTC.
    - cron: '42 7 1 * *'

jobs:
  test_tracks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        track:
          - image_decoding
          - bci_decoding
          - sleep_onset
          - emg_pose
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install benchopt (dev) + CPU test stack
        run: |
          pip install -U pip
          pip install "benchopt @ git+https://github.com/benchopt/benchopt@main"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install scikit-learn
      - name: Test (Simulated only, no per-class installs)
        run: |
          benchopt test tracks/${{ matrix.track }} --skip-install \
              -k simulated -vl

  lint:
    uses: benchopt/template_benchmark/.github/workflows/lint_benchmarks.yml@main
