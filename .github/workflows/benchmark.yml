# CI for the 4 track benchmarks (tracks/<name>/).
# Mirrors benchopt/template_benchmark's main.yml, but points the reusable
# test workflow at each track sub-folder via the ``benchmark_dir`` input
# (the benchmarks live in subdirectories of the competition monorepo).
name: Benchmark

on:
  push:
    branches:
      - main
  create:
    tags:
      - '**'
  pull_request:
    branches:
      - main
  schedule:
    # Run every 1st of the month at 7:42am UTC.
    - cron: '42 7 1 * *'

jobs:
  benchopt_dev:
    strategy:
      fail-fast: false
      matrix:
        track:
          - image_decoding
          - bci_decoding
          - sleep_onset
          - emg_pose
    uses: benchopt/template_benchmark/.github/workflows/test_benchmarks.yml@main
    with:
      benchopt_branch: benchopt@main
      benchmark_dir: ./tracks/${{ matrix.track }}
      # Restrict to the zero-download Simulated tests: installing the real
      # data stack (neuralbench -> torch==2.6 + CUDA wheels) exceeds the
      # runners' disk. Real-data runs happen on the cluster instead.
      extra_args: "-k simulated"
  lint:
    uses: benchopt/template_benchmark/.github/workflows/lint_benchmarks.yml@main
